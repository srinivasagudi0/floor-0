<html>
    <style>
    body{font-family:monospace;text-align:center; font-size: 2rem;}
    h1{font-size:5rem}
    button{font-size:5rem;margin:5px;padding:10px 20px}
    #a{font-size:10rem;letter-spacing:4px}
    </style>
    <body>
        <h1>FLOOR <span id="floor-no">12</span></h1>
        <p>Reach floor 0. Use &uarr; and &darr;</p>
    <button id="up">&uarr;</button>
    <button id="down">&darr;</button>
    <h2 id="a"></h2>
    </body>
<script>
        let floor=12;
        let moving=0;

        function move() {
            moving=1;
            let o = audio.createOscillator();
            o.frequency.value=60;
            o.connect(audio.destination);
            o.start();
            o.stop(audio.currentTime+1.2);

            setTimeout(()=>moving=0,700);
        }

        messages = ["DON'T LOOK BACK.", "WRONG FLOOR", "GO BACK", "I CAN SEE YOU","SOMEONE IS HERE", "BAD CHOICE", "IT KNOWS YOUR FLOOR", "DONT OPEN THE DOOR"];
        let stuck=0;
        let hits=0;

        function e(){
            if(stuck){
                hits++;
                if(hits>=3){
                    stuck=0;
                    hits=0;
                    document.getElementById("floor-no").textContent=floor;
                    a.textContent="...";
                }
                return true;
            }
        }

        function corrupt(){
            if(Math.random()<.05 && floor>0){
                stuck=1;
                a.textContent="S̷Y̷S̷T̷E̷M̷ ̷E̷R̷R̷O̷R̷";
                document.getElementById("floor-no").textContent="?!"+floor;
                return true;
            }
        }

        document.getElementById("up").addEventListener("click",function(){
            if(e())return;
            if(moving)return;
            if(floor<30){
                move();
                floor++;
                ding();
                if(Math.random()<.08)glitch();
                document.getElementById("floor-no").textContent=floor;
                if (Math.random() * 30 > 15) {
                    quote = Math.floor(Math.random()*messages.length);
                    a.textContent= messages[quote];
                }
                light();
                corrupt();
            }
        });
        
        document.getElementById("down").addEventListener("click",function(){
            if(e())return;
            if(moving)return;
            if(floor>0){
                move();
                if(Math.random()<.08)glitch();
                if(Math.random()<.1 && floor>1){
                    floor-=2;
                    a.textContent="YOU MISSED A FLOOR";
                }else{
                    floor--;
                    if(Math.random()*30<15){
                        quote=Math.floor(Math.random()*messages.length);
                        a.textContent=messages[quote];
                    }
                }
                ding();
                document.getElementById("floor-no").textContent=floor;
                light();
                corrupt();
            }

            if(floor===0){
                a.textContent="THE DOORS OPEN";
                document.body.style.background="#000";
                document.body.style.color="#fff";
                up.disabled=down.disabled=true;
            }
        });

        function glitch(){
            let x=["scale(2)","rotate(8deg)","translateX(100px)","rotate(180deg)"];
            document.body.style.transform=x[Math.floor(Math.random()*x.length)];
            setTimeout(()=>document.body.style.transform="",400);
        }

        function light(){
            let brightness=10+floor*7.5;
            document.body.style.background=`rgb(${brightness},${brightness},${brightness})`;
        }
        light();

        let audio=new AudioContext();
        function ding(){
            let o=audio.createOscillator();
            o.frequency.value = 200 + floor *15
            o.connect(audio.destination);
            o.start();
            o.stop(audio.currentTime+.15);
        }
</script>
</html>
